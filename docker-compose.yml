services:
  api:
    build: .
    image: coldchain-closure-checker:latest
    ports:
      - "8000:8000"
    environment:
      # 人工纠偏 SQLite 库位置（挂载命名卷，容器重启后纠偏记录保留）
      CORRECTION_DB_PATH: /data/corrections.db
    volumes:
      - correction-data:/data
    depends_on:
      sample-site:
        condition: service_started
    networks:
      - closure-net

  sample-site:
    build: ./sample-site
    image: closure-sample-site:latest
    ports:
      - "8080:8080"
    networks:
      - closure-net

networks:
  closure-net:
    driver: bridge

volumes:
  correction-data:
